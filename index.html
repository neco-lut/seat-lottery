<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決めくじ引き</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary);
    }

    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #64748b;
    }

    .row-header {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #475569;
      padding: 0 4px;
    }

    .input-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 50vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-remove {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background-color: var(--danger);
      color: white;
    }

    .btn-add {
      width: 100%;
      background-color: #f1f5f9;
      color: #334155;
      border: 2px dashed var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .btn-add:hover {
      background-color: #e2e8f0;
      border-color: #94a3b8;
    }

    .btn-add:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-style: solid;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .error-message {
      display: none;
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
    }

    .result-section {
      margin-top: 28px;
      display: none;
    }

    .result-section h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }

    .seat-card {
      background: #f1f5f9;
      padding: 14px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease-out;
    }

    .seat-name {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .member-name {
      font-size: 1.05rem;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 座席決めくじ引き</h1>

    <div id="errorBox" class="error-message"></div>

    <div class="info-bar">
      <span>入力項目</span>
      <span id="countDisplay">0 / 20枠</span>
    </div>

    <div class="row-header">
      <span>参加者名</span>
      <span>席名 / 席番号</span>
      <span></span>
    </div>

    <div class="input-list" id="inputList">
      <!-- ここに行が動的に追加されます -->
    </div>

    <button type="button" class="btn-add" id="btnAdd" onclick="addRow()">＋ 入力枠を増やす</button>

    <button type="button" class="btn-submit" onclick="drawSeats()">くじを引く！</button>

    <div class="result-section" id="resultSection">
      <h2>🎉 抽選結果</h2>
      <div class="result-grid" id="resultGrid"></div>
    </div>
  </div>

  <script>
    const MAX_ROWS = 20;

    // 初期表示時に4行作成
    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < 4; i++) {
        addRow();
      }
    });

    // 行の追加
    function addRow(nameVal = '', seatVal = '') {
      const list = document.getElementById('inputList');
      const currentRows = list.querySelectorAll('.input-row').length;

      if (currentRows >= MAX_ROWS) return;

      const row = document.createElement('div');
      row.className = 'input-row';
      row.innerHTML = `
        <input type="text" class="input-member" placeholder="例: 佐藤" value="${nameVal}">
        <input type="text" class="input-seat" placeholder="例: 1番 / A卓" value="${seatVal}">
        <button type="button" class="btn-remove" onclick="removeRow(this)" title="削除">×</button>
      `;

      list.appendChild(row);
      updateCount();
    }

    // 行の削除
    function removeRow(btn) {
      const list = document.getElementById('inputList');
      const rows = list.querySelectorAll('.input-row');
      
      // 最低1行は残す
      if (rows.length <= 1) {
        showError('少なくとも1つの枠が必要です。');
        return;
      }

      btn.closest('.input-row').remove();
      hideError();
      updateCount();
    }

    // 件数カウントとボタン状態更新
    function updateCount() {
      const list = document.getElementById('inputList');
      const count = list.querySelectorAll('.input-row').length;
      
      document.getElementById('countDisplay').textContent = `${count} / ${MAX_ROWS}枠`;
      
      const btnAdd = document.getElementById('btnAdd');
      if (count >= MAX_ROWS) {
        btnAdd.disabled = true;
        btnAdd.textContent = '最大件数（20枠）に達しました';
      } else {
        btnAdd.disabled = false;
        btnAdd.textContent = '＋ 入力枠を増やす';
      }
    }

    function shuffleArray(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // 抽選実行
    function drawSeats() {
      hideError();

      const memberInputs = document.querySelectorAll('.input-member');
      const seatInputs = document.querySelectorAll('.input-seat');

      const members = [];
      const seats = [];
      let hasEmptyField = false;

      memberInputs.forEach((input, index) => {
        const mVal = input.value.trim();
        const sVal = seatInputs[index].value.trim();

        // どちらか一方でも入力されている場合は空欄チェック対象
        if (mVal || sVal) {
          if (!mVal || !sVal) {
            hasEmptyField = true;
          } else {
            members.push(mVal);
            seats.push(sVal);
          }
        }
      });

      if (hasEmptyField) {
        showError('参加者名と席名の両方を入力してください（未入力の項目があります）。');
        return;
      }

      if (members.length === 0) {showError('少なくとも1セット以上の名前と席名を入力してください。');
        return;
      }

      // 席をランダムにシャッフル
      const shuffledSeats = shuffleArray(seats);

      const resultGrid = document.getElementById('resultGrid');
      resultGrid.innerHTML = '';

      members.forEach((member, index) => {
        const card = document.createElement('div');
        card.className = 'seat-card';
        card.innerHTML = `
          <div class="seat-name">🪑 ${shuffledSeats[index]}</div>
          <div class="member-name">${member}</div>
        `;
        resultGrid.appendChild(card);
      });

      document.getElementById('resultSection').style.display = 'block';
    }
  </script>
</body>
</html>
