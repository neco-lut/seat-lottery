<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決めくじ引き</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 24px;
      text-align: center;
      color: var(--primary);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 20px;
    }

    @media (max-width: 500px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    label {
      font-weight: 600;
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .hint {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: normal;
    }

    textarea {
      width: 100%;
      height: 160px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      line-height: 1.5;
      resize: vertical;
      transition: border-color 0.2s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    button {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button:hover {
      background-color: var(--primary-hover);
    }

    .error-message {
      display: none;
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      text-align: center;
    }

    .result-section {
      margin-top: 32px;
      display: none;
    }

    .result-section h2 {
      font-size: 1.2rem;
      margin-bottom: 16px;
      text-align: center;
    }

    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 12px;
    }

    .seat-card {
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
      text-align: center;
      border: 1px solid var(--border);
      animation: fadeIn 0.3s ease-out;
    }

    .seat-name {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
      margin-bottom: 6px;
    }

    .member-name {
      font-size: 1.1rem;
      font-weight: bold;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 座席決めくじ引き</h1>

    <div id="errorBox" class="error-message"></div>

    <div class="form-grid">
      <div class="form-group">
        <label for="members">
          参加者の名前
          <span class="hint">（改行またはカンマ区切り）</span>
        </label>
        <textarea id="members" placeholder="佐藤&#10;鈴木&#10;高橋&#10;田中"></textarea>
      </div>

      <div class="form-group">
        <label for="seats">
          席の名前 / 席番号
          <span class="hint">（改行またはカンマ区切り）</span>
        </label>
        <textarea id="seats" placeholder="A卓-1&#10;A卓-2&#10;B卓-1&#10;B卓-2"></textarea>
      </div>
    </div>

    <button onclick="drawSeats()">くじを引く！</button>

    <div class="result-section" id="resultSection">
      <h2>🎉 抽選結果</h2>
      <div class="result-grid" id="resultGrid"></div>
    </div>
  </div>

  <script>
    // 配列をシャッフルする関数（フィッシャー–イェーツ）
    function shuffleArray(array) {
      const result = [...array];
      for (let i = result.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [result[i], result[j]] = [result[j], result[i]];
      }
      return result;
    }

    // 入力文字列を整理して配列にする関数
    function parseInput(text) {
      return text
        .split(/[\n,]/)
        .map(item => item.trim())
        .filter(item => item.length > 0);
    }

    function showError(message) {
      const errorBox = document.getElementById('errorBox');
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      document.getElementById('resultSection').style.display = 'none';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    function drawSeats() {
      hideError();

      const memberInput = document.getElementById('members').value;
      const seatInput = document.getElementById('seats').value;

      const members = parseInput(memberInput);
      const seats = parseInput(seatInput);

      // バリデーション
      if (members.length === 0) {
        showError('参加者の名前を入力してください。');
        return;
      }

      if (seats.length === 0) {
        showError('席の名前を入力してください。');
        return;
      }

      if (members.length !== seats.length) {
        showError(`人数と席数が一致していません。（参加者: ${members.length}人 / 席数: ${seats.length}席）`);
        return;
      }

      // 席の順番をシャッフル（参加者とランダムに組み合わせる）
      const shuffledSeats = shuffleArray(seats);

      const resultGrid = document.getElementById('resultGrid');
      resultGrid.innerHTML = '';

      // 結果の生成
      members.forEach((member, index) => {
        const card = document.createElement('div');
        card.className = 'seat-card';
        card.innerHTML = `
          <div class="seat-name">🪑 ${shuffledSeats[index]}</div>
          <div class="member-name">${member}</div>
        `;
        resultGrid.appendChild(card);
      });

      document.getElementById('resultSection').style.display = 'block';
    }
  </script>
</body>
</html>
