<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>座席決めくじ引き</title>
  <!-- 紙吹雪（クラッカー）演出用ライブラリ -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --secondary: #10b981;
      --secondary-hover: #059669;
      --danger: #ef4444;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #cbd5e1;
      --error-bg: #fef2f2;
      --error-text: #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 680px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      box-sizing: border-box;
    }

    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
      color: var(--primary);
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      font-size: 0.95rem;
      margin-top: -12px;
      margin-bottom: 24px;
    }

    /* 入力フェーズのスタイル */
    .info-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #64748b;
    }

    .row-header {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      margin-bottom: 8px;
      color: #475569;
      padding: 0 4px;
    }

    .input-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
      max-height: 45vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr 40px;
      gap: 8px;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
    }

    .btn-remove {
      background-color: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      border-radius: 8px;
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .btn-remove:hover {
      background-color: var(--danger);
      color: white;
    }

    .btn-add {
      width: 100%;
      background-color: #f1f5f9;
      color: #334155;
      border: 2px dashed var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 20px;
    }

    .btn-add:hover {
      background-color: #e2e8f0;
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .error-message {
      display: none;
      background-color: var(--error-bg);
      color: var(--error-text);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.9rem;
      text-align: center;
    }

    /* くじ引きフェーズのスタイル */
    #lotteryPhase {
      display: none;
    }

    .section-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 10px;
    }

    .member-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 24px;
    }

    .chip {
      padding: 8px 16px;
      background: #f1f5f9;
      border: 2px solid var(--border);
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip:hover {
      border-color: var(--primary);
      background: #e0e7ff;
    }

    .chip.selected {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
    }

    .chip.done {
      background: #e2e8f0;
      color: #94a3b8;
      border-color: #cbd5e1;
      cursor: not-allowed;
      text-decoration: line-through;
    }

    .box-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }

    .animal-box {
      aspect-ratio: 1;
      background: #ffffff;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      user-select: none;
    }

    .animal-box:hover:not(.opened):not(.disabled) {
      transform: translateY(-4px);
      border-color: var(--primary);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.15);
    }

    .animal-box.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .animal-box.opened {
      background: #f0fdf4;
      border-color: var(--secondary);
      cursor: default;
      animation: popIn 0.3s ease-out;
    }

    .animal-icon {
      font-size: 2.2rem;
      margin-bottom: 4px;
    }

    .animal-name {
      font-size: 0.8rem;
      font-weight: 600;
      color: #64748b;
    }

    .box-result {
      text-align: center;
    }

    .box-result .res-seat {
      font-size: 1rem;
      font-weight: bold;
      color: var(--secondary);
      margin-bottom: 2px;
    }

    .box-result .res-member {
      font-size: 0.85rem;
      color: #334155;
    }

    /* 結果一覧画面 */
    #summarySection {
      display: none;
      margin-top: 32px;
      padding-top: 24px;
      border-top: 2px dashed var(--border);
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .summary-card {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }

    .summary-seat {
      font-size: 0.85rem;
      color: var(--primary);
      font-weight: 600;
    }

    .summary-member {
      font-size: 1.05rem;
      font-weight: bold;
      margin-top: 4px;
    }

    .btn-reset {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      width: 100%;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-reset:hover {
      background-color: #475569;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎲 座席決めくじ引き</h1>

    <div id="errorBox" class="error-message"></div>

    <!-- フェーズ1: 設定入力画面 -->
    <div id="setupPhase">
      <div class="info-bar">
        <span>入力項目</span>
        <span id="countDisplay">0 / 20枠</span>
      </div>

      <div class="row-header">
        <span>参加者名</span>
        <span>席名 / 席番号</span>
        <span></span>
      </div>

      <div class="input-list" id="inputList"></div>

      <button type="button" class="btn-add" id="btnAdd" onclick="addRow()">＋ 入力枠を増やす</button>
      <button type="button" class="btn-submit" onclick="startLottery()">くじ引きをスタート！</button>
    </div>

    <!-- フェーズ2: くじ引き実行画面 -->
    <div id="lotteryPhase">
      <div class="subtitle">自分の名前を選択してから、好きな動物ボックスを押してください</div>

      <div class="section-title">1. あなたの名前を選択</div>
      <div class="member-chips" id="memberChips"></div>

      <div class="section-title">2. 動物ボックスを選択</div>
      <div class="box-grid" id="boxGrid"></div>

      <!-- 全員終了後の結果まとめ -->
      <div id="summarySection">
        <h1>🎉 最終結果一覧</h1>
        <div class="summary-grid" id="summaryGrid"></div>
        <button type="button" class="btn-reset" onclick="resetAll()">最初からやり直す</button>
      </div>
    </div>
  </div>

  <script>
    const MAX_ROWS = 20;

    // 動物カード用テンプレートデータ（ランダム割り当て）
    const ANIMAL_POOL = [
      { icon: '🦁', name: 'ライオン' },
      { icon: '🐼', name: 'パンダ' },
      { icon: '🐨', name: 'コアラ' },
      { icon: '🦊', name: 'キツネ' },
      { icon: '🐰', name: 'ウサギ' },
      { icon: '🐯', name: 'トラ' },
      { icon: '🐻', name: 'クマ' },
      { icon: 'ペンギン', icon: '🐧', name: 'ペンギン' },
      { icon: 'ハムスター', icon: '🐹', name: 'ハムスター' },
      { icon: 'ネコ', icon: '🐱', name: 'ネコ' },
      { icon: 'イヌ', icon: '🐶', name: 'イヌ' },
      { icon: 'サル', icon: '🐵', name: 'サル' },
      { icon: 'リス', icon: '🐿️', name: 'リス' },
      { icon: 'ゾウ', icon: '🐘', name: 'ゾウ' },
      { icon: 'キリン', icon: '🦒', name: 'キリン' },
      { icon: 'アルパカ', icon: '🦙', name: 'アルパカ' },
      { icon: 'フクロウ', icon: '🦉', name: 'フクロウ' },
      { icon: 'カワウソ', icon: '🦦', name: 'カワウソ' },
      { icon: 'ヒヨコ', icon: '🐤', name: 'ヒヨコ' },
      { icon: 'カエル', icon: '🐸', name: 'カエル' }
    ];

    let lotteryData = {
      members: [],       // 未選択のメンバーリスト
      assigned: [],      // 決定済みの結果リスト [{member, seat, animal}]
      shuffledSeats: [], // シャッフルされた席リスト
      selectedMember: null
    };

    window.addEventListener('DOMContentLoaded', () => {
      for (let i = 0; i < 4; i++) {
        addRow();
      }
    });

    function addRow(nameVal = '', seatVal = '') {
      const list = document.getElementById('inputList');
      const currentRows = list.querySelectorAll('.input-row').length;

      if (currentRows >= MAX_ROWS) return;

      const row = document.createElement('div');
      row.className = 'input-row';
      row.innerHTML = `
        <input type="text" class="input-member" placeholder="例: 佐藤" value="${nameVal}">
        <input type="text" class="input-seat" placeholder="例: A卓 / 1番" value="${seatVal}">
        <button type="button" class="btn-remove" onclick="removeRow(this)" title="削除">×</button>
      `;

      list.appendChild(row);
      updateCount();
    }

    function removeRow(btn) {
      const list = document.getElementById('inputList');
      if (list.querySelectorAll('.input-row').length <= 1) {
        showError('少なくとも1つの枠が必要です。');
        return;
      }
      btn.closest('.input-row').remove();
      hideError();
      updateCount();
    }

    function updateCount() {
      const count = document.querySelectorAll('.input-row').length;
      document.getElementById('countDisplay').textContent = `${count} / ${MAX_ROWS}枠`;
      const btnAdd = document.getElementById('btnAdd');
      btnAdd.disabled = count >= MAX_ROWS;
      btnAdd.textContent = count >= MAX_ROWS ? '最大件数（20枠）に達しました' : '＋ 入力枠を増やす';
    }

    function shuffleArray(array) {
      const res = [...array];
      for (let i = res.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [res[i], res[j]] = [res[j], res[i]];
      }
      return res;
    }

    function showError(msg) {
      const box = document.getElementById('errorBox');
      box.textContent = msg;
      box.style.display = 'block';
    }

    function hideError() {
      document.getElementById('errorBox').style.display = 'none';
    }

    // くじ引きフェーズへの遷移
    function startLottery() {
      hideError();

      const memberInputs = document.querySelectorAll('.input-member');
      const seatInputs = document.querySelectorAll('.input-seat');

      const members = [];
      const seats = [];
      let hasEmpty = false;

      memberInputs.forEach((input, idx) => {
        const m = input.value.trim();
        const s = seatInputs[idx].value.trim();
        if (m || s) {
          if (!m || !s) {
            hasEmpty = true;
          } else {
            members.push(m);
            seats.push(s);
          }
        }
      });

      if (hasEmpty) {
        showError('参加者名と席名の両方を入力してください。');
        return;
      }

      if (members.length === 0) {
        showError('少なくとも1セット以上の名前と席名を入力してください。');
        return;
      }

      // データ初期化
      lotteryData.members = members;
      lotteryData.shuffledSeats = shuffleArray(seats);
      lotteryData.assigned = [];
      lotteryData.selectedMember = null;

      // 画面切り替え
      document.getElementById('setupPhase').style.display = 'none';
      document.getElementById('lotteryPhase').style.display = 'block';

      renderChips();
      renderBoxes(seats.length);
    }

    // 名前チップの描画
    function renderChips() {
      const container = document.getElementById('memberChips');
      container.innerHTML = '';

      // 全メンバーのチップを生成
      const allMembers = [...lotteryData.members, ...lotteryData.assigned.map(a => a.member)];

      allMembers.forEach(name => {
        const isDone = lotteryData.assigned.some(a => a.member === name);
        const isSelected = lotteryData.selectedMember === name;

        const chip = document.createElement('div');
        chip.className = `chip ${isDone ? 'done' : ''} ${isSelected ? 'selected' : ''}`;
        chip.textContent = name;

        if (!isDone) {
          chip.onclick = () => selectMember(name);
        }

        container.appendChild(chip);
      });
    }

    // メンバー選択
    function selectMember(name) {
      lotteryData.selectedMember = name;
      renderChips();
      updateBoxState();
    }

    // 動物ボックスの描画
    function renderBoxes(count) {
      const grid = document.getElementById('boxGrid');
      grid.innerHTML = '';

      const animals = shuffleArray(ANIMAL_POOL).slice(0, count);

      for (let i = 0; i < count; i++) {
        const animal = animals[i % animals.length];
        const box = document.createElement('div');
        box.className = 'animal-box disabled';
        box.id = `box-${i}`;
        box.dataset.index = i;
        box.dataset.animalIcon = animal.icon;
        box.dataset.animalName = animal.name;

        box.innerHTML = `
          <div class="animal-icon">${animal.icon}</div>
          <div class="animal-name">${animal.name}</div>
        `;

        box.onclick = () => openBox(i);
        grid.appendChild(box);
      }
    }

    // ボックスの選択可否状態の更新
    function updateBoxState() {
      const boxes = document.querySelectorAll('.animal-box');
      boxes.forEach(box => {
        if (!box.classList.contains('opened')) {
          if (lotteryData.selectedMember) {
            box.classList.remove('disabled');
          } else {
            box.classList.add('disabled');
          }
        }
      });
    }

    // ボックスを開く（くじを引く）
    function openBox(index) {
      const box = document.getElementById(`box-${index}`);

      if (box.classList.contains('opened') || !lotteryData.selectedMember) {
        if (!lotteryData.selectedMember) {
          showError('先にあなたの名前を選択してください！');
        }
        return;
      }

      hideError();

      const member = lotteryData.selectedMember;
      const seat = lotteryData.shuffledSeats[lotteryData.assigned.length];
      const animalIcon = box.dataset.animalIcon;

      // 結果を保存
      lotteryData.assigned.push({ member, seat, animalIcon });
      lotteryData.members = lotteryData.members.filter(m => m !== member);
      lotteryData.selectedMember = null;

      // ボックス見た目更新
      box.classList.remove('disabled');
      box.classList.add('opened');
      box.innerHTML = `
        <div class="box-result">
          <div class="res-seat">🪑 ${seat}</div>
          <div class="res-member">${member}</div>
        </div>
      `;

      // 派手な紙吹雪クラッカー演出！
      fireConfetti();

      // UI更新
      renderChips();
      updateBoxState();

      // 全員終了チェック
      if (lotteryData.members.length === 0) {
        showSummary();
      }
    }

    // クラッカー演出（紙吹雪）
    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 80,
          spread: 70,
          origin: { y: 0.6 }
        });
      }
    }

    // 最終一覧表示
    function showSummary() {
      const summarySection = document.getElementById('summarySection');
      const summaryGrid = document.getElementById('summaryGrid');
      summaryGrid.innerHTML = '';

      lotteryData.assigned.forEach(item => {
        const card = document.createElement('div');
        card.className = 'summary-card';
        card.innerHTML = `
          <div class="summary-seat">${item.animalIcon} ${item.seat}</div>
          <div class="summary-member">${item.member}</div>
        `;
        summaryGrid.appendChild(card);
      });

      summarySection.style.display = 'block';

      // 最終フィナーレの紙吹雪
      setTimeout(() => {
        if (typeof confetti === 'function') {
          confetti({ particleCount: 150, spread: 100, origin: { y: 0.4 } });
        }
      }, 300);
    }

    // 最初からやり直す
    function resetAll() {
      document.getElementById('summarySection').style.display = 'none';
      document.getElementById('lotteryPhase').style.display = 'none';
      document.getElementById('setupPhase').style.display = 'block';
      hideError();
    }
  </script>
</body>
</html>
